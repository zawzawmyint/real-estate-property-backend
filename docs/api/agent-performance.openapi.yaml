openapi: '3.1.0'
info:
  title: 'Agent performance reporting'
  version: '1.0.0'
paths:
  '/api/v1/staff/reports/agent-performance':
    get:
      operationId: 'getAgentPerformanceReport'
      summary: 'Read recorded agent work and first-Won outcomes'
      description: 'Admin and Manager may select all eligible identities or one identity. Agents see their own history. Inclusive Dubai dates use calendar years 0001–9999, must be supplied together, span at most 366 days and end by today. Defaults to the current Dubai month through today. Only the first transition to Won counts. Response episodes start in the period. Counts reflect recorded work. Incomplete histories can cause additional unquantifiable omissions. Options and rows sort by display name then ID using ordinal UTF-16 order. Explicit selection returns one option.'
      security:
        - StaffCookie: []
      parameters:
        - in: 'query'
          name: 'from'
          required: false
          schema:
            type: 'string'
            format: 'date'
            pattern: "^(?!0000)\\d{4}-\\d{2}-\\d{2}$"
        - in: 'query'
          name: 'to'
          required: false
          schema:
            type: 'string'
            format: 'date'
            pattern: "^(?!0000)\\d{4}-\\d{2}-\\d{2}$"
        - in: 'query'
          name: 'agentId'
          required: false
          schema:
            type: 'string'
            minLength: 1
            maxLength: 128
        - in: 'query'
          name: 'page'
          required: false
          schema:
            type: 'integer'
            minimum: 1
            default: 1
        - in: 'query'
          name: 'pageSize'
          required: false
          schema:
            type: 'integer'
            enum: [25, 50]
            default: 25
      responses:
        '200':
          description: 'Authorized report'
          headers:
            Cache-Control:
              schema:
                type: 'string'
                const: 'no-store'
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AgentPerformanceReport'
        '400':
          description: 'VALIDATION_ERROR — Invalid, repeated or unknown filters'
          headers:
            Cache-Control:
              schema:
                type: 'string'
                const: 'no-store'
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ReportError'
        '401':
          description: 'UNAUTHENTICATED — Sign-in required'
          headers:
            Cache-Control:
              schema:
                type: 'string'
                const: 'no-store'
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ReportError'
        '403':
          description: 'FORBIDDEN — Selection outside authorized scope'
          headers:
            Cache-Control:
              schema:
                type: 'string'
                const: 'no-store'
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ReportError'
        '404':
          description: 'NOT_FOUND — Unknown agent'
          headers:
            Cache-Control:
              schema:
                type: 'string'
                const: 'no-store'
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ReportError'
        '422':
          description: 'REPORT_TOO_LARGE — Narrow the dates or select an agent'
          headers:
            Cache-Control:
              schema:
                type: 'string'
                const: 'no-store'
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ReportError'
        '500':
          description: 'INTERNAL_ERROR — Unexpected server error'
          headers:
            Cache-Control:
              schema:
                type: 'string'
                const: 'no-store'
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ReportError'
components:
  securitySchemes:
    StaffCookie:
      type: 'apiKey'
      in: 'cookie'
      name: 'agency.session'
      description: 'Production uses __Host-agency.session with Secure.'
  schemas:
    AgentPerformanceIdentity:
      type: 'object'
      additionalProperties: false
      required: ['id', 'name', 'availability']
      properties:
        id:
          type: 'string'
        name:
          type: 'string'
        availability:
          type: 'string'
          enum: ['active', 'inactive', 'former']
    AgentPerformanceRow:
      type: 'object'
      additionalProperties: false
      required:
        [
          'agent',
          'leadsHandled',
          'dealsClosed',
          'assignmentEpisodes',
          'completedFollowUps',
          'averageFirstFollowUpSeconds',
          'awaitingFollowUp',
          'endedWithoutFollowUp',
        ]
      properties:
        agent:
          $ref: '#/components/schemas/AgentPerformanceIdentity'
        leadsHandled:
          type: 'integer'
          minimum: 0
        dealsClosed:
          type: 'integer'
          minimum: 0
        assignmentEpisodes:
          type: 'integer'
          minimum: 0
        completedFollowUps:
          type: 'integer'
          minimum: 0
        averageFirstFollowUpSeconds:
          type: ['integer', 'null']
          minimum: 0
        awaitingFollowUp:
          type: 'integer'
          minimum: 0
        endedWithoutFollowUp:
          type: 'integer'
          minimum: 0
    AgentPerformanceCoverage:
      type: 'object'
      additionalProperties: false
      required:
        [
          'excludedActionCount',
          'excludedAssignmentEpisodeCount',
          'unattributedFirstWinCount',
          'hasLimitations',
        ]
      properties:
        excludedActionCount:
          type: 'integer'
          minimum: 0
        excludedAssignmentEpisodeCount:
          type: 'integer'
          minimum: 0
        unattributedFirstWinCount:
          type: 'integer'
          minimum: 0
        hasLimitations:
          type: 'boolean'
    AgentPerformanceReport:
      type: 'object'
      additionalProperties: false
      required:
        [
          'generatedAt',
          'timezone',
          'from',
          'to',
          'rangeStart',
          'rangeEndExclusive',
          'asOf',
          'scope',
          'page',
          'pageSize',
          'total',
          'items',
          'agentOptions',
          'coverage',
        ]
      properties:
        generatedAt:
          type: 'string'
          format: 'date-time'
        timezone:
          type: 'string'
          const: 'Asia/Dubai'
        from:
          type: 'string'
          format: 'date'
          pattern: "^(?!0000)\\d{4}-\\d{2}-\\d{2}$"
        to:
          type: 'string'
          format: 'date'
          pattern: "^(?!0000)\\d{4}-\\d{2}-\\d{2}$"
        rangeStart:
          type: 'string'
          format: 'date-time'
        rangeEndExclusive:
          type: 'string'
          format: 'date-time'
        asOf:
          type: 'string'
          format: 'date-time'
        scope:
          type: 'string'
          enum: ['agency', 'mine']
        page:
          type: 'integer'
          minimum: 1
          default: 1
        pageSize:
          type: 'integer'
          enum: [25, 50]
          default: 25
        total:
          type: 'integer'
          minimum: 0
          maximum: 2000
        items:
          type: 'array'
          maxItems: 50
          items:
            $ref: '#/components/schemas/AgentPerformanceRow'
        agentOptions:
          type: 'array'
          maxItems: 2000
          items:
            $ref: '#/components/schemas/AgentPerformanceIdentity'
        coverage:
          $ref: '#/components/schemas/AgentPerformanceCoverage'
    ReportError:
      type: 'object'
      additionalProperties: false
      required: ['error']
      properties:
        error:
          type: 'object'
          additionalProperties: false
          required: ['code', 'message', 'requestId']
          properties:
            code:
              type: 'string'
            message:
              type: 'string'
            requestId:
              type: 'string'
