            {
              'operationId': 'getLeadImportTemplate',
              'summary': 'Download the lead CSV import template',
              'description': 'Current Admin/Manager only. Header-only UTF-8 BOM and CRLF; filename lead-import-template.csv. No writes.',
              'security': [{ 'StaffCookie': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': 'CSV template attachment',
                      'headers':
                        {
                          'Cache-Control':
                            {
                              'schema':
                                { 'type': 'string', 'const': 'no-store' },
                            },
                          'X-Request-Id': { 'schema': { 'type': 'string' } },
                          'X-Content-Type-Options':
                            {
                              'schema':
                                { 'type': 'string', 'const': 'nosniff' },
                            },
                          'Content-Disposition':
                            {
                              'schema':
                                {
                                  'type': 'string',
                                  'const': 'attachment; filename="lead-import-template.csv"',
                                },
                            },
                        },
                      'content':
                        {
                          'text/csv; charset=utf-8':
                            { 'schema': { 'type': 'string' } },
                        },
                    },
                  '401':
                    {
                      'description': 'UNAUTHENTICATED: current staff session required.',
                      'headers':
                        {
                          'Cache-Control':
