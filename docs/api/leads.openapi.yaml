  'components':
    {
      'securitySchemes':
        {
          'StaffCookie':
            {
              'type': 'apiKey',
              'in': 'cookie',
              'name': 'agency.session',
              'description': 'Production __Host-agency.session',
            },
        },
      'schemas':
        {
          'AgencyInquiryInput':
            {
              'type': 'object',
              'additionalProperties': false,
              'required': ['submissionId', 'name', 'purpose', 'message'],
              'properties':
                {
                  'submissionId': { 'type': 'string', 'format': 'uuid' },
                  'name':
                    { 'type': 'string', 'minLength': 1, 'maxLength': 120 },
                  'phone':
                    {
                      'type': ['string', 'null'],
                      'minLength': 3,
                      'pattern': "^[+\\d\\s()-]*\\d[+\\d\\s()-]*$",
                      'description': 'Every JavaScript whitespace character is replaced with ASCII space, then trimmed before validation. The canonical phone must be 3-40 characters, contain a digit, and use only plus, digits, ASCII spaces, parentheses or hyphens. Repeated internal spaces are preserved. At least one phone or email is required.',
                    },
                  'email':
                    {
                      'type': ['string', 'null'],
                      'format': 'email',
                      'maxLength': 254,
                    },
                  'message':
                    { 'type': 'string', 'minLength': 1, 'maxLength': 2000 },
                  'purpose': { 'type': 'string', 'enum': ['sale', 'rent'] },
                },
              'anyOf':
                [
                  {
                    'required': ['phone'],
                    'properties': { 'phone': { 'type': 'string' } },
                  },
                  {
                    'required': ['email'],
                    'properties': { 'email': { 'type': 'string' } },
                  },
                ],
            },
          'LeadStage':
            {
              'type': 'string',
              'enum':
                [
                  'new',
                  'contacted',
                  'viewing_scheduled',
                  'offer',
                  'won',
                  'lost',
                ],
            },
          'LeadStaffSummary':
            {
              'type': 'object',
              'additionalProperties': false,
              'required': ['id', 'name', 'available'],
              'properties':
                {
                  'id': { 'type': 'string' },
                  'name': { 'type': 'string' },
                  'available': { 'type': 'boolean' },
                },
            },
          'LeadPropertyContext':
            {
              'type': 'object',
              'additionalProperties': false,
              'required': ['id', 'title', 'location', 'available'],
              'properties':
                {
                  'id': { 'type': ['string', 'null'] },
                  'title': { 'type': 'string' },
                  'location': { 'type': ['string', 'null'] },
                  'available': { 'type': 'boolean' },
                },
            },
          'LeadSummary':
            {
              'type': 'object',
              'additionalProperties': false,
              'required':
                [
                  'id',
                  'name',
                  'phone',
                  'email',
                  'purpose',
                  'budgetFils',
                  'source',
                  'stage',
                  'assignedAgent',
                  'previousAgentName',
                  'property',
                  'createdAt',
                  'updatedAt',
                  'version',
                ],
              'properties':
                {
                  'id': { 'type': 'string', 'format': 'uuid' },
                  'name':
                    { 'type': 'string', 'minLength': 1, 'maxLength': 120 },
                  'phone':
                    {
                      'type': ['string', 'null'],
                      'minLength': 3,
                      'maxLength': 40,
                      'pattern': "^[+\\d ()-]*\\d[+\\d ()-]*$",
                      'description': 'Canonical phone: ASCII spaces only, trimmed, 3-40 characters and at least one digit. Repeated internal spaces are preserved.',
                    },
                  'email':
                    {
                      'type': ['string', 'null'],
                      'format': 'email',
                      'maxLength': 254,
                    },
                  'purpose': { 'type': 'string', 'enum': ['sale', 'rent'] },
                  'budgetFils':
                    {
                      'type': ['integer', 'null'],
                      'minimum': 1,
                      'maximum': 1000000000000,
                    },
                  'source':
                    {
                      'type': 'string',
                      'enum': ['website', 'call', 'walk_in'],
                    },
                  'stage':
                    {
                      'type': 'string',
                      'enum':
                        [
                          'new',
                          'contacted',
                          'viewing_scheduled',
                          'offer',
                          'won',
                          'lost',
                        ],
                    },
                  'assignedAgent':
                    {
                      'anyOf':
                        [
                          { '$ref': '#/components/schemas/LeadStaffSummary' },
                          { 'type': 'null' },
                        ],
                    },
                  'previousAgentName': { 'type': ['string', 'null'] },
                  'property':
                    {
                      'anyOf':
                        [
                          {
