{
  'openapi': '3.1.0',
  'info':
    {
      'title': 'Lead management API',
      'version': '1.0.0',
      'description': 'Backend-owned independent lead/inquiry OpenAPI snapshot. Preserves native auth and existing property contract in main OpenAPI.',
    },
  'servers': [{ 'url': 'http://localhost:4311' }],
  'paths':
    {
      '/api/v1/staff/leads/imports/template':
