                  'location': { 'type': ['string', 'null'] },
                  'available': { 'type': 'boolean' },
                },
            },
          'LeadSummary':
            {
              'type': 'object',
              'additionalProperties': false,
              'required':
                [
                  'id',
                  'name',
                  'phone',
                  'email',
                  'purpose',
                  'budgetFils',
                  'source',
                  'stage',
                  'assignedAgent',
                  'previousAgentName',
                  'property',
                  'createdAt',
                  'updatedAt',
                  'version',
                ],
              'properties':
                {
                  'id': { 'type': 'string', 'format': 'uuid' },
                  'name':
                    { 'type': 'string', 'minLength': 1, 'maxLength': 120 },
                  'phone':
                    {
                      'type': ['string', 'null'],
                      'minLength': 3,
                      'maxLength': 40,
                      'pattern': "^[+\\d ()-]*\\d[+\\d ()-]*$",
                      'description': 'Canonical phone: ASCII spaces only, trimmed, 3-40 characters and at least one digit. Repeated internal spaces are preserved.',
                    },
                  'email':
                    {
                      'type': ['string', 'null'],
                      'format': 'email',
                      'maxLength': 254,
                    },
                  'purpose': { 'type': 'string', 'enum': ['sale', 'rent'] },
                  'budgetFils':
                    {
                      'type': ['integer', 'null'],
                      'minimum': 1,
                      'maximum': 1000000000000,
                    },
                  'source':
                    {
                      'type': 'string',
                      'enum': ['website', 'call', 'walk_in'],
                    },
                  'stage':
                    {
                      'type': 'string',
                      'enum':
                        [
                          'new',
                          'contacted',
                          'viewing_scheduled',
                          'offer',
                          'won',
                          'lost',
                        ],
                    },
                  'assignedAgent':
                    {
                      'anyOf':
