                },
            },
          'InquiryInput':
            {
              'type': 'object',
              'additionalProperties': false,
              'required': ['submissionId', 'name'],
              'properties':
                {
                  'submissionId': { 'type': 'string', 'format': 'uuid' },
                  'name':
                    { 'type': 'string', 'minLength': 1, 'maxLength': 120 },
                  'phone':
                    {
                      'type': ['string', 'null'],
