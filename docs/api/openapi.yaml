openapi: 3.1.0
info:
  title: Real Estate API
  version: 0.1.0
  description: Public foundation routes and the supported Better Auth 1.7.12 native staff-authentication subset. Property management and privacy-safe public discovery are implemented.
servers:
  - url: http://localhost:4311
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Process liveness, independent of database readiness
      responses:
        '200':
          description: Process is running
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service]
                properties:
                  status:
                    const: ok
                  service:
                    const: real-estate-api
  /media/{key}:
    get:
      operationId: getPublicImage
      summary: Retrieve a saved public image
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          description: Generated UUID key with an allowed image extension. Property uploads produce generated public WebP keys.
      responses:
        '200':
          description: Public image, with Cross-Origin-Resource-Policy cross-origin
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/auth/sign-in/email:
    post:
      operationId: signInEmail
      summary: Sign in provisioned staff using the native Better Auth protocol
      description: Requires Origin equal to APP_ORIGIN. No signup or administration HTTP endpoints exist. Auth request bodies are limited to 100 KiB before native JSON parsing, including chunked requests. Account throttling allows five attempts per normalized email in fifteen minutes and one hundred attempts per service per minute (single process).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, rememberMe]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Trimmed and lowercased before validation and credential lookup.
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                  writeOnly: true
                rememberMe:
                  const: true
                  description: Fixed policy; eight-hour absolute sessions, no sliding refresh.
      responses:
        '200':
          description: Native successful sign-in; token metadata is protocol data and must never be logged, rendered, persisted in browser storage or used as a bearer credential.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: Signed HttpOnly SameSite=Lax Path=/ host-only agency.session cookie; production uses Secure __Host-agency.session. Max-Age=28800.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [redirect, token, user]
                properties:
                  redirect:
                    const: false
                  token:
                    type: string
                    description: Native protocol metadata, not an application bearer API.
                  user:
                    $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/AuthFailure'
        '401':
          $ref: '#/components/responses/AuthFailure'
        '403':
          $ref: '#/components/responses/AuthFailure'
        '413':
          $ref: '#/components/responses/AuthFailure'
        '415':
          $ref: '#/components/responses/AuthFailure'
        '429':
          description: Login throttled; all attempts including successful attempts count.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until retry is permitted.
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '500':
          $ref: '#/components/responses/AuthFailure'
  /api/v1/auth/get-session:
    get:
      operationId: getSession
      summary: Read the current database session and staff identity
      description: Cookie caching and sliding refresh are disabled. Current database role and disabled state are authoritative. Missing, invalid, tampered, expired, revoked or disabled sessions return native 200 null. A store failure returns a non-2xx error. Server callers may omit Origin.
      security:
        - staffCookie: []
        - {}
      responses:
        '200':
          description: Native session/user or null; never infer authorization solely from cookie presence. Session token fields are native protocol metadata.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [user, session]
                    properties:
                      user:
                        $ref: '#/components/schemas/StaffUser'
                      session:
                        $ref: '#/components/schemas/StaffSession'
        '500':
          $ref: '#/components/responses/AuthFailure'
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Revoke only the current session and expire its cookie
      description: Requires exact trusted Origin even without a session. Native empty body or JSON object is accepted. Missing or expired sessions succeed idempotently. Password reset and deactivation revoke all sessions through trusted operator commands only.
      security:
        - staffCookie: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Native logout success, with expiration of the matching signed session cookie.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: Expire the same session cookie name and path with Max-Age=0.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    const: true
        '403':
          $ref: '#/components/responses/AuthFailure'
        '413':
          $ref: '#/components/responses/AuthFailure'
        '415':
          $ref: '#/components/responses/AuthFailure'
        '500':
          $ref: '#/components/responses/AuthFailure'
  /api/v1/properties:
    {
      'get':
        {
          'operationId': 'listPublicProperties',
          'summary': 'List published available public properties',
          'description': 'Filters combine with AND except location city/community OR. No private fields. Featured is optional; no fallback inventory. All property responses use Cache-Control: no-store. Unknown/duplicate query keys and malformed numeric strings return 400. Stable sorting uses ID ascending as tie-breaker.',
          'parameters':
            [
              {
                'in': 'query',
                'name': 'purpose',
                'required': false,
                'schema': { 'type': 'string', 'enum': ['sale', 'rent'] },
              },
              {
                'in': 'query',
                'name': 'type',
                'required': false,
                'schema':
                  {
                    'type': 'string',
                    'enum': ['apartment', 'villa', 'townhouse', 'penthouse'],
                  },
              },
              {
                'in': 'query',
                'name': 'location',
                'required': false,
                'schema':
                  {
                    'type': 'string',
                    'minLength': 1,
                    'maxLength': 120,
                    'description': 'Trimmed case-insensitive city OR community substring.',
                  },
              },
              {
                'in': 'query',
                'name': 'minPriceFils',
                'required': false,
                'schema':
                  { 'type': 'integer', 'minimum': 0, 'maximum': 1000000000000 },
              },
              {
                'in': 'query',
                'name': 'maxPriceFils',
                'required': false,
                'schema':
                  { 'type': 'integer', 'minimum': 0, 'maximum': 1000000000000 },
              },
              {
                'in': 'query',
                'name': 'minBedrooms',
                'required': false,
                'schema': { 'type': 'integer', 'minimum': 0, 'maximum': 20 },
              },
              {
                'in': 'query',
                'name': 'featured',
                'required': false,
                'schema': { 'type': 'string', 'enum': ['true', 'false'] },
              },
              {
                'in': 'query',
                'name': 'sort',
                'required': false,
                'schema':
                  {
                    'type': 'string',
                    'enum': ['newest', 'price_asc', 'price_desc'],
                    'default': 'newest',
                  },
              },
              {
                'in': 'query',
                'name': 'page',
                'required': false,
                'schema':
                  {
                    'type': 'integer',
                    'minimum': 1,
                    'maximum': 10000,
                    'default': 1,
                  },
              },
              {
                'in': 'query',
                'name': 'pageSize',
                'required': false,
                'schema':
                  {
                    'type': 'integer',
                    'minimum': 1,
                    'maximum': 48,
                    'default': 12,
                  },
              },
            ],
          'responses':
            {
              '200':
                {
                  'description': 'Success',
                  'headers':
                    {
                      'Cache-Control':
                        { '$ref': '#/components/headers/NoStore' },
                      'X-Request-Id':
                        { '$ref': '#/components/headers/RequestId' },
                    },
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              '$ref': '#/components/schemas/PublicPropertyList',
                            },
                        },
                    },
                },
              '400': { '$ref': '#/components/responses/PropertyError' },
              '404': { '$ref': '#/components/responses/PropertyError' },
              '500': { '$ref': '#/components/responses/PropertyError' },
            },
        },
    }
  /api/v1/properties/{id}:
    {
      'get':
        {
          'operationId': 'getPublicProperty',
          'summary': 'Read one eligible public property',
          'description': 'Missing, draft, archived, sold and rented records all return 404. All property responses use Cache-Control: no-store. Unknown/duplicate query keys and malformed numeric strings return 400. Stable sorting uses ID ascending as tie-breaker.',
          'parameters':
            [
              {
                'in': 'path',
                'name': 'id',
                'required': true,
                'schema': { 'type': 'string', 'format': 'uuid' },
              },
            ],
          'responses':
            {
              '200':
                {
                  'description': 'Success',
                  'headers':
                    {
                      'Cache-Control':
                        { '$ref': '#/components/headers/NoStore' },
                      'X-Request-Id':
                        { '$ref': '#/components/headers/RequestId' },
                    },
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              '$ref': '#/components/schemas/PublicPropertyDetail',
                            },
                        },
                    },
                },
              '400': { '$ref': '#/components/responses/PropertyError' },
              '404': { '$ref': '#/components/responses/PropertyError' },
              '500': { '$ref': '#/components/responses/PropertyError' },
            },
        },
    }
  /api/v1/staff/properties:
    {
      'get':
        {
          'operationId': 'listStaffProperties',
          'summary': 'Search all staff inventory',
          'description': 'Admin/Manager/Agent. q matches title/city/community only; owner contact is never searched. All property responses use Cache-Control: no-store. Unknown/duplicate query keys and malformed numeric strings return 400. Stable sorting uses ID ascending as tie-breaker.',
          'security': [{ 'staffCookie': [] }],
          'parameters':
            [
              {
                'in': 'query',
                'name': 'purpose',
                'required': false,
                'schema': { 'type': 'string', 'enum': ['sale', 'rent'] },
              },
              {
                'in': 'query',
                'name': 'type',
                'required': false,
                'schema':
                  {
                    'type': 'string',
                    'enum': ['apartment', 'villa', 'townhouse', 'penthouse'],
                  },
              },
              {
                'in': 'query',
                'name': 'location',
                'required': false,
                'schema':
                  {
                    'type': 'string',
                    'minLength': 1,
                    'maxLength': 120,
                    'description': 'Trimmed case-insensitive city OR community substring.',
                  },
              },
              {
                'in': 'query',
                'name': 'minPriceFils',
                'required': false,
                'schema':
                  { 'type': 'integer', 'minimum': 0, 'maximum': 1000000000000 },
              },
              {
                'in': 'query',
                'name': 'maxPriceFils',
                'required': false,
                'schema':
                  { 'type': 'integer', 'minimum': 0, 'maximum': 1000000000000 },
              },
              {
                'in': 'query',
                'name': 'minBedrooms',
                'required': false,
                'schema': { 'type': 'integer', 'minimum': 0, 'maximum': 20 },
              },
              {
                'in': 'query',
                'name': 'featured',
                'required': false,
                'schema': { 'type': 'string', 'enum': ['true', 'false'] },
              },
              {
                'in': 'query',
                'name': 'sort',
                'required': false,
                'schema':
                  {
                    'type': 'string',
                    'enum':
                      ['newest', 'price_asc', 'price_desc', 'updated_desc'],
                    'default': 'updated_desc',
                  },
              },
              {
                'in': 'query',
                'name': 'page',
                'required': false,
                'schema':
                  {
                    'type': 'integer',
                    'minimum': 1,
                    'maximum': 10000,
                    'default': 1,
                  },
              },
              {
                'in': 'query',
                'name': 'pageSize',
                'required': false,
                'schema':
                  {
                    'type': 'integer',
                    'minimum': 1,
                    'maximum': 48,
                    'default': 12,
                  },
              },
              {
                'in': 'query',
                'name': 'q',
                'required': false,
                'schema':
                  { 'type': 'string', 'minLength': 1, 'maxLength': 160 },
              },
              {
                'in': 'query',
                'name': 'publishingState',
                'required': false,
                'schema':
                  {
                    'type': 'string',
                    'enum': ['draft', 'published', 'archived'],
                  },
              },
              {
                'in': 'query',
                'name': 'availability',
                'required': false,
                'schema':
                  { 'type': 'string', 'enum': ['available', 'sold', 'rented'] },
              },
            ],
          'responses':
            {
              '200':
                {
                  'description': 'Success',
                  'headers':
                    {
                      'Cache-Control':
                        { '$ref': '#/components/headers/NoStore' },
                      'X-Request-Id':
                        { '$ref': '#/components/headers/RequestId' },
                    },
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              '$ref': '#/components/schemas/StaffPropertyList',
                            },
                        },
                    },
                },
              '400': { '$ref': '#/components/responses/PropertyError' },
              '401': { '$ref': '#/components/responses/PropertyError' },
              '403': { '$ref': '#/components/responses/PropertyError' },
              '404': { '$ref': '#/components/responses/PropertyError' },
              '500': { '$ref': '#/components/responses/PropertyError' },
            },
        },
      'post':
        {
          'operationId': 'createProperty',
          'summary': 'Create a draft property',
          'description': 'Admin/Manager only. All property responses use Cache-Control: no-store. Unknown/duplicate query keys and malformed numeric strings return 400. Stable sorting uses ID ascending as tie-breaker.',
          'security': [{ 'staffCookie': [] }],
          'parameters':
            [
              {
                'in': 'header',
                'name': 'Origin',
                'required': true,
                'schema': { 'type': 'string' },
                'description': 'Exact configured APP_ORIGIN; checked before request-body parsing.',
              },
            ],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        { '$ref': '#/components/schemas/CreateProperty' },
                    },
                },
            },
          'responses':
            {
              '201':
                {
                  'description': 'Created',
                  'headers':
                    {
                      'Cache-Control':
                        { '$ref': '#/components/headers/NoStore' },
                      'X-Request-Id':
                        { '$ref': '#/components/headers/RequestId' },
                      'Location':
                        {
                          'schema': { 'type': 'string' },
                          'description': 'Created staff property resource (property creation only).',
                        },
                    },
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            { '$ref': '#/components/schemas/StaffProperty' },
                        },
                    },
                },
              '400': { '$ref': '#/components/responses/PropertyError' },
              '401': { '$ref': '#/components/responses/PropertyError' },
              '403': { '$ref': '#/components/responses/PropertyError' },
              '404': { '$ref': '#/components/responses/PropertyError' },
              '409': { '$ref': '#/components/responses/PropertyError' },
              '413': { '$ref': '#/components/responses/PropertyError' },
              '415': { '$ref': '#/components/responses/PropertyError' },
              '500': { '$ref': '#/components/responses/PropertyError' },
            },
        },
    }
  /api/v1/staff/properties/{id}:
    {
      'get':
        {
          'operationId': 'getStaffProperty',
          'summary': 'Read staff property details',
          'description': ' All property responses use Cache-Control: no-store. Unknown/duplicate query keys and malformed numeric strings return 400. Stable sorting uses ID ascending as tie-breaker.',
          'security': [{ 'staffCookie': [] }],
          'parameters':
            [
              {
                'in': 'path',
                'name': 'id',
                'required': true,
                'schema': { 'type': 'string', 'format': 'uuid' },
              },
            ],
          'responses':
            {
              '200':
                {
                  'description': 'Success',
                  'headers':
                    {
                      'Cache-Control':
                        { '$ref': '#/components/headers/NoStore' },
                      'X-Request-Id':
                        { '$ref': '#/components/headers/RequestId' },
                    },
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            { '$ref': '#/components/schemas/StaffProperty' },
                        },
                    },
                },
              '400': { '$ref': '#/components/responses/PropertyError' },
              '401': { '$ref': '#/components/responses/PropertyError' },
              '403': { '$ref': '#/components/responses/PropertyError' },
              '404': { '$ref': '#/components/responses/PropertyError' },
              '500': { '$ref': '#/components/responses/PropertyError' },
            },
        },
      'patch':
        {
          'operationId': 'patchProperty',
          'summary': 'Edit, publish, unpublish, archive or restore a property',
          'description': 'Admin/Manager. Archive hides listing. Restore becomes draft. Scalar edits are last committed write wins; never automatically retry ambiguous writes. All property responses use Cache-Control: no-store. Unknown/duplicate query keys and malformed numeric strings return 400. Stable sorting uses ID ascending as tie-breaker.',
          'security': [{ 'staffCookie': [] }],
          'parameters':
            [
              {
                'in': 'path',
                'name': 'id',
                'required': true,
                'schema': { 'type': 'string', 'format': 'uuid' },
              },
              {
                'in': 'header',
                'name': 'Origin',
                'required': true,
                'schema': { 'type': 'string' },
                'description': 'Exact configured APP_ORIGIN; checked before request-body parsing.',
              },
            ],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        { '$ref': '#/components/schemas/PatchProperty' },
                    },
                },
            },
          'responses':
            {
              '200':
                {
                  'description': 'Success',
                  'headers':
                    {
                      'Cache-Control':
                        { '$ref': '#/components/headers/NoStore' },
                      'X-Request-Id':
                        { '$ref': '#/components/headers/RequestId' },
                    },
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            { '$ref': '#/components/schemas/StaffProperty' },
                        },
                    },
                },
              '400': { '$ref': '#/components/responses/PropertyError' },
              '401': { '$ref': '#/components/responses/PropertyError' },
              '403': { '$ref': '#/components/responses/PropertyError' },
              '404': { '$ref': '#/components/responses/PropertyError' },
              '409': { '$ref': '#/components/responses/PropertyError' },
              '413': { '$ref': '#/components/responses/PropertyError' },
              '415': { '$ref': '#/components/responses/PropertyError' },
              '500': { '$ref': '#/components/responses/PropertyError' },
            },
        },
      'delete':
        {
          'operationId': 'deleteProperty',
          'summary': 'Permanently delete an archived property',
          'description': 'Admin only. Existing nonarchived property returns 409. Missing record returns 404, including retry after deletion. All property responses use Cache-Control: no-store. Unknown/duplicate query keys and malformed numeric strings return 400. Stable sorting uses ID ascending as tie-breaker.',
          'security': [{ 'staffCookie': [] }],
          'parameters':
            [
              {
                'in': 'path',
                'name': 'id',
                'required': true,
                'schema': { 'type': 'string', 'format': 'uuid' },
              },
              {
                'in': 'header',
                'name': 'Origin',
                'required': true,
                'schema': { 'type': 'string' },
                'description': 'Exact configured APP_ORIGIN; checked before request-body parsing.',
              },
            ],
          'responses':
            {
              '204':
                {
                  'description': 'Deleted; no body. File cleanup follows DB commit; failures are logged for maintenance reconciliation.',
                  'headers':
                    {
                      'Cache-Control':
                        { '$ref': '#/components/headers/NoStore' },
                    },
                },
              '400': { '$ref': '#/components/responses/PropertyError' },
              '401': { '$ref': '#/components/responses/PropertyError' },
              '403': { '$ref': '#/components/responses/PropertyError' },
              '404': { '$ref': '#/components/responses/PropertyError' },
              '409': { '$ref': '#/components/responses/PropertyError' },
              '500': { '$ref': '#/components/responses/PropertyError' },
            },
        },
    }
  /api/v1/staff/properties/{id}/photos:
    {
      'post':
        {
          'operationId': 'uploadPropertyPhoto',
          'summary': 'Append one processed public property image',
          'description': 'Admin/Manager. One raw file, not multipart/base64. 5 MiB streamed and declared limit; 25 million decoded pixels; max 12 photos. MIME must match decoded single-frame JPEG/PNG/WebP; SVG/GIF/animation rejected. Auto-orient, strip metadata, WebP max 2400px without enlargement. Authorization/origin/resource checked before buffering. Draft images are public by direct URL. Failed attachment removes only files confirmed unreferenced; unknown database outcomes retain files for maintenance reconciliation. All property responses use Cache-Control: no-store. Unknown/duplicate query keys and malformed numeric strings return 400. Stable sorting uses ID ascending as tie-breaker.',
          'security': [{ 'staffCookie': [] }],
          'parameters':
            [
              {
                'in': 'path',
                'name': 'id',
                'required': true,
                'schema': { 'type': 'string', 'format': 'uuid' },
              },
              {
                'in': 'header',
                'name': 'Origin',
                'required': true,
                'schema': { 'type': 'string' },
                'description': 'Exact configured APP_ORIGIN; checked before request-body parsing.',
              },
            ],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'image/jpeg':
                    { 'schema': { 'type': 'string', 'format': 'binary' } },
                  'image/png':
                    { 'schema': { 'type': 'string', 'format': 'binary' } },
                  'image/webp':
                    { 'schema': { 'type': 'string', 'format': 'binary' } },
                },
            },
          'responses':
            {
              '201':
                {
                  'description': 'Created',
                  'headers':
                    {
                      'Cache-Control':
                        { '$ref': '#/components/headers/NoStore' },
                      'X-Request-Id':
                        { '$ref': '#/components/headers/RequestId' },
                      'Location':
                        {
                          'schema': { 'type': 'string' },
                          'description': 'Created staff property resource (property creation only).',
                        },
                    },
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            { '$ref': '#/components/schemas/StaffProperty' },
                        },
                    },
                },
              '400': { '$ref': '#/components/responses/PropertyError' },
              '401': { '$ref': '#/components/responses/PropertyError' },
              '403': { '$ref': '#/components/responses/PropertyError' },
              '404': { '$ref': '#/components/responses/PropertyError' },
              '409': { '$ref': '#/components/responses/PropertyError' },
              '413': { '$ref': '#/components/responses/PropertyError' },
              '415': { '$ref': '#/components/responses/PropertyError' },
              '500': { '$ref': '#/components/responses/PropertyError' },
            },
        },
    }
  /api/v1/staff/properties/{id}/photos/order:
    {
      'patch':
        {
          'operationId': 'orderPropertyPhotos',
          'summary': 'Set exact current photo order and cover',
