                            },
                        },
                    },
                },
              'parameters':
                [
                  {
                    'in': 'query',
                    'name': 'leadId',
                    'schema': { 'type': 'string', 'format': 'uuid' },
                  },
                  {
                    'in': 'query',
                    'name': 'status',
                    'schema':
                      {
                        'type': 'string',
                        'enum': ['open', 'completed', 'cancelled', 'all'],
                        'default': 'open',
                      },
                  },
                  {
                    'in': 'query',
                    'name': 'due',
                    'schema':
                      {
                        'type': 'string',
                        'enum': ['all', 'overdue', 'today', 'upcoming'],
                        'default': 'all',
                      },
                  },
                  {
                    'in': 'query',
                    'name': 'page',
                    'schema':
                      {
                        'type': 'integer',
                        'minimum': 1,
                        'maximum': 1000000,
                        'default': 1,
                      },
                  },
                  {
                    'in': 'query',
                    'name': 'pageSize',
                    'schema':
                      {
                        'type': 'integer',
                        'minimum': 1,
                        'maximum': 100,
                        'default': 20,
                      },
                  },
                ],
            },
          'post':
            {
              'operationId': 'createTask',
              'security': [{ 'staffSession': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/TaskResult' },
                            },
                        },
                    },
                  '201':
