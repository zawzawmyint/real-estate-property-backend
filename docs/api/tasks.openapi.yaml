  'components':
    {
      'securitySchemes':
        {
          'staffSession':
            { 'type': 'apiKey', 'in': 'cookie', 'name': 'agency.session' },
        },
      'schemas':
        {
          'Task':
            {
              'type': 'object',
              'additionalProperties': false,
              'required':
                [
                  'id',
                  'lead',
                  'assignedAgent',
                  'title',
                  'notes',
                  'dueAt',
                  'status',
                  'isOverdue',
                  'completedAt',
                  'cancelledAt',
                  'version',
                  'createdAt',
                  'updatedAt',
                ],
              'properties':
                {
                  'id': { 'type': 'string', 'format': 'uuid' },
                  'lead':
                    {
                      'type': 'object',
                      'additionalProperties': false,
                      'required': ['id', 'name'],
                      'properties':
                        {
                          'id': { 'type': 'string' },
                          'name': { 'type': 'string' },
                        },
                    },
                  'assignedAgent':
                    {
                      'anyOf':
                        [
                          {
                            'type': 'object',
                            'additionalProperties': false,
                            'required': ['id', 'name'],
                            'properties':
                              {
                                'id': { 'type': 'string' },
                                'name': { 'type': 'string' },
                              },
                          },
                          { 'type': 'null' },
                        ],
                    },
                  'title': { 'type': 'string' },
                  'notes': { 'type': ['string', 'null'] },
                  'dueAt': { 'type': 'string', 'format': 'date-time' },
                  'status':
                    {
                      'type': 'string',
                      'enum': ['open', 'completed', 'cancelled'],
                    },
                  'isOverdue': { 'type': 'boolean' },
                  'completedAt':
                    { 'type': ['string', 'null'], 'format': 'date-time' },
                  'cancelledAt':
                    { 'type': ['string', 'null'], 'format': 'date-time' },
                  'version': { 'type': 'integer', 'minimum': 1 },
                  'createdAt': { 'type': 'string', 'format': 'date-time' },
                  'updatedAt': { 'type': 'string', 'format': 'date-time' },
                },
            },
          'TaskResult':
            {
              'type': 'object',
              'additionalProperties': false,
              'required': ['task', 'asOf'],
              'properties':
                {
                  'task': { '$ref': '#/components/schemas/Task' },
                  'asOf': { 'type': 'string', 'format': 'date-time' },
                },
            },
          'TaskPage':
            {
              'type': 'object',
              'additionalProperties': false,
              'required': ['items', 'page', 'pageSize', 'total', 'asOf'],
              'properties':
                {
                  'items':
                    {
                      'type': 'array',
                      'items': { '$ref': '#/components/schemas/Task' },
                    },
                  'page': { 'type': 'integer', 'minimum': 1 },
                  'pageSize': { 'type': 'integer', 'minimum': 1 },
                  'total': { 'type': 'integer' },
                  'asOf': { 'type': 'string', 'format': 'date-time' },
                },
            },
          'CreateTask':
            {
              'type': 'object',
              'additionalProperties': false,
              'required':
                [
                  'submissionId',
                  'leadId',
                  'expectedLeadVersion',
                  'title',
                  'dueAt',
                ],
              'properties':
                {
                  'submissionId': { 'type': 'string', 'format': 'uuid' },
                  'leadId': { 'type': 'string', 'format': 'uuid' },
                  'expectedLeadVersion': { 'type': 'integer', 'minimum': 1 },
                  'title':
                    { 'type': 'string', 'minLength': 1, 'maxLength': 160 },
                  'notes': { 'type': ['string', 'null'], 'maxLength': 2000 },
                  'dueAt': { 'type': 'string', 'format': 'date-time' },
                },
            },
          'UpdateTask':
            {
              'type': 'object',
              'additionalProperties': false,
              'required':
                [
                  'expectedVersion',
                  'expectedLeadVersion',
                  'title',
                  'notes',
                  'dueAt',
                ],
              'properties':
                {
                  'expectedVersion': { 'type': 'integer', 'minimum': 1 },
                  'expectedLeadVersion': { 'type': 'integer', 'minimum': 1 },
                  'title':
                    { 'type': 'string', 'minLength': 1, 'maxLength': 160 },
                  'notes': { 'type': ['string', 'null'], 'maxLength': 2000 },
                  'dueAt': { 'type': 'string', 'format': 'date-time' },
                },
            },
          'UpdateTaskStatus':
            {
              'type': 'object',
              'additionalProperties': false,
              'required': ['expectedVersion', 'status'],
              'properties':
                {
                  'expectedVersion': { 'type': 'integer', 'minimum': 1 },
                  'status':
                    { 'type': 'string', 'enum': ['completed', 'cancelled'] },
                },
            },
          'TaskError':
            {
              'type': 'object',
              'additionalProperties': false,
              'required': ['error'],
              'properties':
                {
                  'error':
                    {
                      'type': 'object',
                      'additionalProperties': false,
                      'required': ['code', 'message', 'requestId'],
                      'properties':
                        {
                          'code': { 'type': 'string' },
                          'message': { 'type': 'string' },
                          'requestId': { 'type': 'string' },
                          'existingTaskId':
                            { 'type': 'string', 'format': 'uuid' },
                        },
                    },
                },
            },
        },
    },
}
