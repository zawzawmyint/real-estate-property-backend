              {
                'in': 'path',
                'name': 'id',
                'required': true,
                'schema': { 'type': 'string', 'format': 'uuid' },
              },
            ],
          'get':
            {
              'operationId': 'getTask',
              'security': [{ 'staffSession': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/TaskResult' },
