                            },
                        },
                    },
                  '409':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/TaskError' },
                            },
                        },
                    },
                  '413':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/TaskError' },
                            },
                        },
                    },
                  '415':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/TaskError' },
                            },
                        },
                    },
                },
              'requestBody':
                {
                  'required': true,
