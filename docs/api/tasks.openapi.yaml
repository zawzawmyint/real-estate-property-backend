                              'schema':
                                { '$ref': '#/components/schemas/TaskError' },
                            },
                        },
                    },
                  '404':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/TaskError' },
                            },
                        },
                    },
                  '409':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/TaskError' },
                            },
                        },
                    },
                  '413':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
