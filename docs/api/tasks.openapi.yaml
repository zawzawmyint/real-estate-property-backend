{
  'openapi': '3.1.0',
  'info':
    {
      'title': 'Follow-up task management',
      'version': '1.0.0',
      'description': 'Current lead ownership. UTC instants; Dubai today. Overdue is open and dueAt < asOf. New/changed dates must be future. Authorized identical receipts return current task; changed same-actor receipt exposes existingTaskId only after authorization. Writes require trusted Origin and JSON; strict fields and duplicate query keys rejected.',
    },
  'paths':
    {
      '/api/v1/staff/tasks':
        {
          'get':
            {
              'operationId': 'listTasks',
              'security': [{ 'staffSession': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/TaskPage' },
                            },
                        },
                    },
                  '400':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/TaskError' },
                            },
                        },
                    },
                  '401':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/TaskError' },
                            },
                        },
                    },
                  '404':
                    {
                      'description': 'Task response',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
